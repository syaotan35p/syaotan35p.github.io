<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mobile Piano</title>

<style>
:root { --vh: 1vh; }

* {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  height: calc(var(--vh) * 100);
  overflow: hidden;
  font-family: "Segoe UI","Noto Sans JP",sans-serif;
}

/* Layout */
.piano-wrapper { width: 100vw; height: calc(var(--vh) * 100); position: relative; }

.piano-single { display: flex; width: 100%; height: 100%; }
.piano-double { display: none; flex-direction: column; height: 100%; }

.piano { flex: 1; display: flex; position: relative; }

/* Keys */
.white-key {
  flex: 1;
  background: #fff;
  border: 1px solid #000;
  position: relative;
}

.black-key {
  position: absolute;
  top: 0;
  height: 50%;
  background: #000;
  z-index: 10;
  border-radius: 0 0 10px 10px;
}

.white-key.active { background: #ffe066; }
.black-key.active { background: #ff9800; }

.white-key.next-target { background: #66ff66; }
.black-key.next-target { background: #00cc00; }

/* Labels */
.note-label {
  position: absolute;
  right: 6px;
  bottom: 6px;
  font-size: 2.2vw;
  font-weight: 700;
  color: rgba(0,0,0,0.35);
  pointer-events: none;
}
.black-key .note-label { color: rgba(255,255,255,0.5); }
.note-label.hidden { display: none; }

/* Control Panel */
.control-panel {
  position: absolute;
  top: 8px;
  right: 8px;
  display: none;
  gap: 6px;
  z-index: 100;
}

.control-panel.visible { display: flex; }

.ctrl-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  font-size: 20px;
  cursor: pointer;
  background: rgba(255,255,255,0.9);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  transition: transform 0.1s;
}

.ctrl-btn:active { transform: scale(0.9); }

.ctrl-btn.recording { background: #ff4444; color: white; }
.ctrl-btn.playing { background: #44ff44; color: white; }

/* Log Display */
.log-display {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  max-height: 80px;
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 8px;
  border-radius: 8px;
  font-size: 14px;
  overflow-y: auto;
  display: none;
  z-index: 100;
}

.log-display.visible { display: block; }

.log-display::-webkit-scrollbar {
  width: 4px;
}

.log-display::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.5);
  border-radius: 2px;
}

/* Orientation */
@media (orientation: portrait) {
  .piano-single { display: none; }
  .piano-double { display: flex; }
  .note-label { font-size: 3.8vw; }
}
@media (orientation: landscape) {
  .piano-single { display: flex; }
  .piano-double { display: none; }
}
</style>
</head>

<body>

<div class="piano-wrapper">
  <div class="piano-single" id="piano-single"></div>
  <div class="piano-double">
    <div class="piano" id="piano-top"></div>
    <div class="piano" id="piano-bottom"></div>
  </div>

  <div class="control-panel" id="control-panel">
    <button class="ctrl-btn" id="btn-record" title="録音">🔴</button>
    <button class="ctrl-btn" id="btn-play" title="再生">▶️</button>
    <button class="ctrl-btn" id="btn-undo" title="1つ戻す">↩️</button>
    <button class="ctrl-btn" id="btn-clear" title="クリア">🗑️</button>
  </div>

  <div class="log-display" id="log-display"></div>
</div>

<script>
/* viewport対策 */
function setRealVH() {
  const vh = (window.visualViewport?.height || window.innerHeight) * 0.01;
  document.documentElement.style.setProperty('--vh', `${vh}px`);
}
setRealVH();
window.addEventListener("resize", setRealVH);
window.visualViewport?.addEventListener("resize", setRealVH);

/* URLパラメータ取得 */
const params = new URLSearchParams(window.location.search);
const startKey = parseInt(params.get('start') || '0');
const numKeys = parseInt(params.get('keys') || '24');
const showLabels = params.get('labels') !== 'false';
const copyMode = params.get('copy') === 'true';
const toneType = params.get('tone') || 'sine';

/* Audio */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playNote(freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = toneType;
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.6);
}

/* Notes */
const baseFreq = 261.63;
const noteNames = ["ド","ド#","レ","レ#","ミ","ファ","ファ#","ソ","ソ#","ラ","ラ#","シ"];
const allNotes = [];

for (let i = 0; i < 48; i++) {
  allNotes.push({ 
    freq: baseFreq * Math.pow(2, i / 12), 
    name: noteNames[i % 12],
    octave: Math.floor(i / 12)
  });
}

const notes = allNotes.slice(startKey, startKey + numKeys);
const whitePattern = [0,2,4,5,7,9,11];

/* Build Piano */
function buildPiano(container, slice, sliceStartIndex = 0, skipFirstBlack = false) {
  container.innerHTML = "";
  
  // 白鍵と黒鍵を分けて処理
  const whiteKeyData = [];
  const blackKeyData = [];
  
  slice.forEach((note, i) => {
    const globalIndex = sliceStartIndex + i;
    const actualIndex = (startKey + globalIndex) % 12;
    if (whitePattern.includes(actualIndex)) {
      whiteKeyData.push({ note, localIndex: i, globalIndex, actualIndex });
    } else {
      // skipFirstBlackがtrueで、かつ最初の黒鍵の場合はスキップ
      if (!(skipFirstBlack && i === 0)) {
        blackKeyData.push({ note, localIndex: i, globalIndex, actualIndex });
      }
    }
  });

  // 白鍵を作成
  whiteKeyData.forEach(data => {
    const key = document.createElement("div");
    key.className = "white-key";
    key.dataset.freq = data.note.freq;
    key.dataset.name = data.note.name;

    const label = document.createElement("div");
    label.className = showLabels ? "note-label" : "note-label hidden";
    label.textContent = data.note.name;
    key.appendChild(label);

    container.appendChild(key);
  });

  const whiteW = 100 / whiteKeyData.length;
  const blackW = whiteW * 0.7;

  // 黒鍵を配置
  blackKeyData.forEach(data => {
    // このslice内で、この黒鍵より前にある白鍵の数を数える
    let whiteCountBefore = 0;
    for (let j = 0; j < data.localIndex; j++) {
      const checkGlobalIndex = sliceStartIndex + j;
      const checkIndex = (startKey + checkGlobalIndex) % 12;
      if (whitePattern.includes(checkIndex)) {
        whiteCountBefore++;
      }
    }

    const bk = document.createElement("div");
    bk.className = "black-key";
    bk.dataset.freq = data.note.freq;
    bk.dataset.name = data.note.name;

    const label = document.createElement("div");
    label.className = showLabels ? "note-label" : "note-label hidden";
    label.textContent = data.note.name;
    bk.appendChild(label);

    bk.style.width = blackW + "%";
    
    // 左端の黒鍵（このslice内で左に白鍵がない場合）は左端から少しだけはみ出す
    if (whiteCountBefore === 0) {
      bk.style.left = "-" + (blackW / 2) + "%";
    } else {
      // 通常の黒鍵は白鍵の境界線上に配置
      bk.style.left = whiteCountBefore * whiteW - blackW / 2 + "%";
    }

    container.appendChild(bk);
  });
}

buildPiano(document.getElementById("piano-single"), notes, 0, false);

// 2列モード用の分割
const half = Math.floor(notes.length / 2);
// 境界の音のインデックス
const boundaryIndex = (startKey + half) % 12;
const isBoundaryBlack = !whitePattern.includes(boundaryIndex);

// 境界が黒鍵の場合は上段に含め、下段では表示をスキップ
if (isBoundaryBlack && notes.length > half) {
  buildPiano(document.getElementById("piano-top"), notes.slice(0, half + 1), 0, false);
  buildPiano(document.getElementById("piano-bottom"), notes.slice(half), half, true);
} else {
  buildPiano(document.getElementById("piano-top"), notes.slice(0, half), 0, false);
  buildPiano(document.getElementById("piano-bottom"), notes.slice(half), half, false);
}

/* ===== Copy Mode ===== */
let playLog = [];
let isRecording = false;
let isPlayMode = false;
let playIndex = 0;
let lastNoteTime = 0;
const CHORD_THRESHOLD = 100; // 100ms以内なら同時押しとみなす

const controlPanel = document.getElementById('control-panel');
const btnRecord = document.getElementById('btn-record');
const btnPlay = document.getElementById('btn-play');
const btnUndo = document.getElementById('btn-undo');
const btnClear = document.getElementById('btn-clear');
const logDisplay = document.getElementById('log-display');

if (copyMode) {
  controlPanel.classList.add('visible');
  logDisplay.classList.add('visible');
  
  // localStorageからログを読み込み
  const savedLog = localStorage.getItem('pianoLog');
  if (savedLog) {
    try {
      playLog = JSON.parse(savedLog);
      updateLogDisplay();
    } catch (e) {
      playLog = [];
    }
  }
}

function saveLog() {
  localStorage.setItem('pianoLog', JSON.stringify(playLog));
}

function updateLogDisplay() {
  if (!copyMode) return;
  const displayText = playLog.map(group => {
    if (Array.isArray(group)) {
      return '[' + group.map(n => n.name).join('+') + ']';
    }
    return group.name;
  }).join(' ');
  logDisplay.textContent = displayText;
  logDisplay.scrollTop = logDisplay.scrollHeight;
}

function addToLog(freq, name) {
  if (isRecording && !isPlayMode) {
    const now = Date.now();
    const note = { freq, name };
    
    // 最後の記録から100ms以内なら同時押しとして追加
    if (now - lastNoteTime < CHORD_THRESHOLD && playLog.length > 0) {
      const lastItem = playLog[playLog.length - 1];
      if (Array.isArray(lastItem)) {
        // 既に和音グループがある場合
        lastItem.push(note);
      } else {
        // 単音を和音グループに変換
        playLog[playLog.length - 1] = [lastItem, note];
      }
    } else {
      // 新しい単音として追加
      playLog.push(note);
    }
    
    lastNoteTime = now;
    updateLogDisplay();
    saveLog();
  }
}

function clearHighlight() {
  document.querySelectorAll('.next-target').forEach(el => {
    el.classList.remove('next-target');
  });
}

function highlightNextKey() {
  clearHighlight();
  if (playIndex < playLog.length) {
    const target = playLog[playIndex];
    // 単音か和音かを判定
    if (Array.isArray(target)) {
      // 和音：すべての音をハイライト
      target.forEach(note => {
        const keys = document.querySelectorAll(`[data-freq="${note.freq}"]`);
        keys.forEach(k => k.classList.add('next-target'));
      });
    } else {
      // 単音
      const keys = document.querySelectorAll(`[data-freq="${target.freq}"]`);
      keys.forEach(k => k.classList.add('next-target'));
    }
  }
}

btnRecord.addEventListener('click', () => {
  isRecording = !isRecording;
  btnRecord.classList.toggle('recording', isRecording);
  if (!isRecording) {
    isPlayMode = false;
    btnPlay.classList.remove('playing');
    clearHighlight();
  } else {
    // 録音開始時に再生モードを解除
    isPlayMode = false;
    btnPlay.classList.remove('playing');
    clearHighlight();
  }
});

btnPlay.addEventListener('click', () => {
  if (playLog.length === 0) return;
  isPlayMode = !isPlayMode;
  btnPlay.classList.toggle('playing', isPlayMode);
  
  if (isPlayMode) {
    // 再生モードに入ったら録音を停止
    isRecording = false;
    btnRecord.classList.remove('recording');
    
    playIndex = 0;
    highlightNextKey();
  } else {
    clearHighlight();
  }
});

btnUndo.addEventListener('click', () => {
  if (playLog.length > 0) {
    playLog.pop();
    updateLogDisplay();
    saveLog();
    if (isPlayMode) {
      if (playIndex >= playLog.length) {
        playIndex = playLog.length - 1;
      }
      highlightNextKey();
    }
  }
});

btnClear.addEventListener('click', () => {
  playLog = [];
  playIndex = 0;
  clearHighlight();
  updateLogDisplay();
  saveLog();
});

/* ===== Pointer Events Engine ===== */

const activePointers = new Map();
const currentChordKeys = new Set(); // 現在押されている和音のキー
const recordedFreqsInGesture = new Set(); // 現在のジェスチャーで既に記録した音

function getKeyFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  return el?.closest(".white-key, .black-key");
}

document.addEventListener("pointerdown", e => {
  const key = getKeyFromPoint(e.clientX, e.clientY);
  if (!key) return;

  const freq = parseFloat(key.dataset.freq);
  const name = key.dataset.name;

  if (isPlayMode) {
    // 再生モード：次のキーと一致するかチェック
    if (playIndex < playLog.length) {
      const target = playLog[playIndex];
      
      if (Array.isArray(target)) {
        // 和音の場合：押されたキーを記録
        const matchedNote = target.find(note => Math.abs(freq - note.freq) < 0.1);
        if (matchedNote) {
          key.classList.add("active");
          playNote(freq);
          currentChordKeys.add(freq);
          activePointers.set(e.pointerId, key);
          e.target.setPointerCapture(e.pointerId);
          
          // すべての音が押されたかチェック
          const allPressed = target.every(note => {
            // currentChordKeysに含まれているか確認
            return Array.from(currentChordKeys).some(pressedFreq => 
              Math.abs(pressedFreq - note.freq) < 0.1
            );
          });
          
          if (allPressed) {
            playIndex++;
            currentChordKeys.clear();
            setTimeout(() => highlightNextKey(), 100);
          }
        }
      } else {
        // 単音の場合
        if (Math.abs(freq - target.freq) < 0.1) {
          key.classList.add("active");
          playNote(freq);
          playIndex++;
          highlightNextKey();
          
          activePointers.set(e.pointerId, key);
          e.target.setPointerCapture(e.pointerId);
        }
      }
    }
  } else {
    // 通常モード
    activePointers.set(e.pointerId, key);
    key.classList.add("active");
    playNote(freq);
    
    // 録音時：このポインターで初めて記録する音のみ追加
    if (isRecording) {
      recordedFreqsInGesture.add(freq);
      addToLog(freq, name);
    }

    e.target.setPointerCapture(e.pointerId);
  }
});

document.addEventListener("pointermove", e => {
  if (!activePointers.has(e.pointerId) || isPlayMode) return;

  const prevKey = activePointers.get(e.pointerId);
  const newKey = getKeyFromPoint(e.clientX, e.clientY);

  if (newKey && newKey !== prevKey) {
    prevKey.classList.remove("active");
    newKey.classList.add("active");
    const freq = parseFloat(newKey.dataset.freq);
    const name = newKey.dataset.name;
    playNote(freq);
    
    // スワイプ時：まだ記録していない音のみ追加
    if (isRecording && !recordedFreqsInGesture.has(freq)) {
      recordedFreqsInGesture.add(freq);
      addToLog(freq, name);
    }
    
    activePointers.set(e.pointerId, newKey);
  }
});

function releasePointer(e) {
  const key = activePointers.get(e.pointerId);
  if (key) key.classList.remove("active");
  activePointers.delete(e.pointerId);
  
  // ポインターが全て離れたらジェスチャー終了
  if (activePointers.size === 0) {
    recordedFreqsInGesture.clear();
  }
}

document.addEventListener("pointerup", releasePointer);
document.addEventListener("pointercancel", releasePointer);
document.addEventListener("pointerleave", releasePointer);
</script>

</body>
</html>
