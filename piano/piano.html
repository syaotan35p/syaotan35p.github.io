<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Simple Piano</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
}

.piano {
  position: relative;
  display: flex;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

/* 白鍵 */
.white-key {
  flex: 1;
  background: #fff;
  border: 1px solid #000;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  font-size: 3vw;
  padding-bottom: 10px;
  user-select: none;
}

/* 黒鍵 */
.black-key {
  position: absolute;
  width: 5%;
  height: 50%;
  background: #000;
  top: 0;
  z-index: 10;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  font-size: 2vw;
  padding-bottom: 10px;
  border-radius: 0 0 8px 8px;
}

/* 押した時の色 */
.white-key.active {
  background: #ffeb3b;
}
.black-key.active {
  background: #ff9800;
}
</style>
</head>

<body>

<div class="piano" id="piano"></div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playNote(freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = freq;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.6);
}

// ラから始める（A4）
const baseFreq = 440.0; // ラ
const noteNames = ["ラ","ラ#","シ","ド","ド#","レ","レ#","ミ","ファ","ファ#","ソ","ソ#"];

const notes = [];
for (let i = 0; i < 24; i++) {
  notes.push({
    freq: baseFreq * Math.pow(2, i / 12),
    name: noteNames[i % 12]
  });
}

const piano = document.getElementById("piano");
const whitePattern = [0,2,4,5,7,9,11];

let whiteKeys = [];

// 白鍵生成
notes.forEach((note, i) => {
  const noteIndex = i % 12;
  if (whitePattern.includes(noteIndex)) {
    const key = document.createElement("div");
    key.className = "white-key";
    key.dataset.freq = note.freq;
    key.textContent = note.name;
    piano.appendChild(key);
    whiteKeys.push({ key, index: i });
  }
});

// 黒鍵生成
whiteKeys.forEach((wk, i) => {
  const noteIndex = wk.index % 12;
  if (![4,11].includes(noteIndex)) {
    const blackNote = notes[wk.index + 1];
    if (!blackNote) return;

    const bk = document.createElement("div");
    bk.className = "black-key";
    bk.dataset.freq = blackNote.freq;
    bk.textContent = blackNote.name;

    const leftPercent = ((i + 1) / whiteKeys.length) * 100 - 2.5;
    bk.style.left = leftPercent + "%";

    piano.appendChild(bk);
  }
});

// イベント処理
function addKeyEvents(key) {
  const start = () => {
    key.classList.add("active");
    playNote(parseFloat(key.dataset.freq));
  };
  const end = () => key.classList.remove("active");

  key.addEventListener("mousedown", start);
  key.addEventListener("mouseup", end);
  key.addEventListener("mouseleave", end);

  key.addEventListener("touchstart", e => {
    e.preventDefault();
    start();
  });
  key.addEventListener("touchend", end);
}

document.querySelectorAll(".white-key, .black-key").forEach(addKeyEvents);
</script>

</body>
</html>
