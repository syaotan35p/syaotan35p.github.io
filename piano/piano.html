<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Responsive Piano</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
}

/* ===== 共通 ===== */
.piano-wrapper {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.piano {
  position: relative;
  display: flex;
  flex: 1;
  touch-action: none;
}

/* 横画面：1段 */
.piano.single {
  flex-direction: row;
}

/* 縦画面：2段 */
.piano.double {
  flex-direction: row;
}

/* ===== 鍵盤 ===== */
.white-key {
  flex: 1;
  background: #fff;
  border: 1px solid #000;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  font-size: 4vw;
  padding-bottom: 8px;
  user-select: none;
}

.black-key {
  position: absolute;
  width: 5%;
  height: 50%;
  background: #000;
  top: 0;
  z-index: 10;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  font-size: 3vw;
  padding-bottom: 6px;
  border-radius: 0 0 8px 8px;
}

.white-key.active { background: #ffeb3b; }
.black-key.active { background: #ff9800; }

/* ===== 縦画面対応 ===== */
@media (orientation: portrait) {
  .piano-wrapper {
    flex-direction: column;
  }
  .piano {
    height: 50vh;
  }
  .white-key {
    font-size: 6vw;
  }
  .black-key {
    font-size: 4vw;
  }
}
</style>
</head>

<body>

<div class="piano-wrapper">
  <div class="piano" id="piano-top"></div>
  <div class="piano" id="piano-bottom"></div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playNote(freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = freq;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.6);
}

/* ラから24鍵 */
const baseFreq = 440;
const noteNames = ["ラ","ラ#","シ","ド","ド#","レ","レ#","ミ","ファ","ファ#","ソ","ソ#"];
const notes = [];

for (let i = 0; i < 24; i++) {
  notes.push({
    freq: baseFreq * Math.pow(2, i / 12),
    name: noteNames[i % 12]
  });
}

const whitePattern = [0,2,4,5,7,9,11];

function buildPiano(container, noteSlice) {
  let whiteKeys = [];

  noteSlice.forEach((note, i) => {
    const idx = i % 12;
    if (whitePattern.includes(idx)) {
      const key = document.createElement("div");
      key.className = "white-key";
      key.dataset.freq = note.freq;
      key.textContent = note.name;
      container.appendChild(key);
      whiteKeys.push({ key, index: i });
    }
  });

  whiteKeys.forEach((wk, i) => {
    const idx = wk.index % 12;
    if (![4,11].includes(idx)) {
      const blackNote = noteSlice[wk.index + 1];
      if (!blackNote) return;

      const bk = document.createElement("div");
      bk.className = "black-key";
      bk.dataset.freq = blackNote.freq;
      bk.textContent = blackNote.name;

      const leftPercent = ((i + 1) / whiteKeys.length) * 100 - 2.5;
      bk.style.left = leftPercent + "%";

      container.appendChild(bk);
    }
  });
}

buildPiano(document.getElementById("piano-top"), notes.slice(0,12));
buildPiano(document.getElementById("piano-bottom"), notes.slice(12,24));

function addKeyEvents(key) {
  const start = () => {
    key.classList.add("active");
    playNote(parseFloat(key.dataset.freq));
  };
  const end = () => key.classList.remove("active");

  key.addEventListener("mousedown", start);
  key.addEventListener("mouseup", end);
  key.addEventListener("mouseleave", end);

  key.addEventListener("touchstart", e => {
    e.preventDefault();
    start();
  });
  key.addEventListener("touchend", end);
}

document.querySelectorAll(".white-key, .black-key").forEach(addKeyEvents);
</script>

</body>
</html>
