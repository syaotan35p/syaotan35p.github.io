<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Simple Mobile Piano</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
}

/* ===== レイアウト ===== */
.piano-wrapper {
  width: 100vw;
  height: 100vh;
}

/* 横画面：1段 */
.piano-single {
  display: flex;
  width: 100%;
  height: 100%;
  position: relative;
}

/* 縦画面：2段 */
.piano-double {
  display: none;
  width: 100%;
  height: 100%;
  flex-direction: column;
}

/* ===== 鍵盤共通 ===== */
.piano {
  position: relative;
  display: flex;
  flex: 1;
  touch-action: none;
}

/* 白鍵 */
.white-key {
  flex: 1;
  background: #fff;
  border: 1px solid #000;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  font-size: 4vw;
  padding-bottom: 10px;
  user-select: none;
}

/* 黒鍵（白鍵と同じ幅・高さだけ半分） */
.black-key {
  position: absolute;
  top: 0;
  height: 50%;
  background: #000;
  z-index: 10;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  font-size: 3vw;
  padding-bottom: 6px;
}

/* 押した時の色 */
.white-key.active { background: #ffeb3b; }
.black-key.active { background: #ff9800; }

/* ===== 画面向き制御 ===== */
@media (orientation: portrait) {
  .piano-single { display: none; }
  .piano-double { display: flex; }
  .white-key { font-size: 6vw; }
  .black-key { font-size: 4vw; }
}

@media (orientation: landscape) {
  .piano-single { display: flex; }
  .piano-double { display: none; }
}
</style>
</head>

<body>

<div class="piano-wrapper">

  <!-- 横画面用 -->
  <div class="piano-single" id="piano-single"></div>

  <!-- 縦画面用 -->
  <div class="piano-double">
    <div class="piano" id="piano-top"></div>
    <div class="piano" id="piano-bottom"></div>
  </div>

</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playNote(freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = freq;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.6);
}

/* ===== 音階（ドレミ開始・24鍵）===== */
const baseFreq = 261.63; // ド
const noteNames = ["ド","ド#","レ","レ#","ミ","ファ","ファ#","ソ","ソ#","ラ","ラ#","シ"];
const notes = [];

for (let i = 0; i < 24; i++) {
  notes.push({
    freq: baseFreq * Math.pow(2, i / 12),
    name: noteNames[i % 12]
  });
}

const whitePattern = [0,2,4,5,7,9,11];

function buildPiano(container, noteSlice) {
  container.innerHTML = "";
  let whiteKeys = [];

  noteSlice.forEach((note, i) => {
    const idx = i % 12;
    if (whitePattern.includes(idx)) {
      const key = document.createElement("div");
      key.className = "white-key";
      key.dataset.freq = note.freq;
      key.textContent = note.name;
      container.appendChild(key);
      whiteKeys.push({ key, index: i });
    }
  });

  whiteKeys.forEach((wk, i) => {
    const idx = wk.index % 12;
    if (![4,11].includes(idx)) {
      const blackNote = noteSlice[wk.index + 1];
      if (!blackNote) return;

      const bk = document.createElement("div");
      bk.className = "black-key";
      bk.dataset.freq = blackNote.freq;
      bk.textContent = blackNote.name;

      const widthPercent = 100 / whiteKeys.length;
      bk.style.width = widthPercent + "%";
      bk.style.left = (i + 1) * widthPercent - widthPercent / 2 + "%";

      container.appendChild(bk);
    }
  });
}

/* 横画面：24鍵 */
buildPiano(document.getElementById("piano-single"), notes);

/* 縦画面：12鍵 + 12鍵 */
buildPiano(document.getElementById("piano-top"), notes.slice(0,12));
buildPiano(document.getElementById("piano-bottom"), notes.slice(12,24));

/* ===== イベント ===== */
function addKeyEvents(key) {
  const start = () => {
    key.classList.add("active");
    playNote(parseFloat(key.dataset.freq));
  };
  const end = () => key.classList.remove("active");

  key.addEventListener("mousedown", start);
  key.addEventListener("mouseup", end);
  key.addEventListener("mouseleave", end);

  key.addEventListener("touchstart", e => {
    e.preventDefault();
    start();
  });
  key.addEventListener("touchend", end);
}

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".white-key, .black-key").forEach(addKeyEvents);
});
</script>

</body>
</html>
