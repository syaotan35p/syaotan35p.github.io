<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mobile Piano</title>

<style>
:root { --vh: 1vh; }

html, body {
  margin: 0;
  padding: 0;
  background: #000;
  height: calc(var(--vh) * 100);
  overflow: hidden;
  font-family: "Segoe UI","Noto Sans JP",sans-serif;
}

/* ===== Layout ===== */
.piano-wrapper {
  width: 100vw;
  height: calc(var(--vh) * 100);
}

.piano-single {
  display: flex;
  width: 100%;
  height: 100%;
  position: relative;
}

.piano-double {
  display: none;
  width: 100%;
  height: 100%;
  flex-direction: column;
}

.piano {
  position: relative;
  display: flex;
  flex: 1;
  touch-action: none;
}

/* ===== Keys ===== */
.white-key {
  flex: 1;
  background: #fff;
  border: 1px solid #000;
  position: relative;
}

.black-key {
  position: absolute;
  top: 0;
  height: 50%;
  background: #000;
  z-index: 10;
  border-radius: 0 0 8px 8px;
}

/* 押下カラー */
.white-key.active { background: #ffe066; }
.black-key.active { background: #ff9800; }

/* 音名刻印 */
.note-label {
  position: absolute;
  right: 6px;
  bottom: 6px;
  font-size: 2.2vw;
  font-weight: 700;
  color: rgba(0,0,0,0.35);
  pointer-events: none;
}

.black-key .note-label {
  color: rgba(255,255,255,0.5);
}

/* ===== Orientation ===== */
@media (orientation: portrait) {
  .piano-single { display: none; }
  .piano-double { display: flex; }
  .note-label { font-size: 3.8vw; }
}

@media (orientation: landscape) {
  .piano-single { display: flex; }
  .piano-double { display: none; }
}
</style>
</head>

<body>

<div class="piano-wrapper">
  <div class="piano-single" id="piano-single"></div>

  <div class="piano-double">
    <div class="piano" id="piano-top"></div>
    <div class="piano" id="piano-bottom"></div>
  </div>
</div>

<script>
/* ===== viewport対策 ===== */
function setRealVH() {
  const vh = (window.visualViewport?.height || window.innerHeight) * 0.01;
  document.documentElement.style.setProperty('--vh', `${vh}px`);
}
setRealVH();
window.addEventListener("resize", setRealVH);
window.visualViewport?.addEventListener("resize", setRealVH);

/* ===== Audio ===== */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playNote(freq) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = freq;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.6);
}

/* ===== Notes ===== */
const baseFreq = 261.63;
const noteNames = ["ド","ド#","レ","レ#","ミ","ファ","ファ#","ソ","ソ#","ラ","ラ#","シ"];
const notes = [];

for (let i = 0; i < 24; i++) {
  notes.push({
    freq: baseFreq * Math.pow(2, i / 12),
    name: noteNames[i % 12]
  });
}

const whitePattern = [0,2,4,5,7,9,11];

/* ===== Build Piano ===== */
function buildPiano(container, slice) {
  container.innerHTML = "";
  let whiteKeys = [];

  slice.forEach((note, i) => {
    if (whitePattern.includes(i % 12)) {
      const key = document.createElement("div");
      key.className = "white-key";
      key.dataset.freq = note.freq;

      const label = document.createElement("div");
      label.className = "note-label";
      label.textContent = note.name;
      key.appendChild(label);

      container.appendChild(key);
      whiteKeys.push({ key, index: i });
    }
  });

  const whiteW = 100 / whiteKeys.length;
  const blackW = whiteW * 0.7;

  whiteKeys.forEach((wk, i) => {
    if (![4,11].includes(wk.index % 12)) {
      const note = slice[wk.index + 1];
      if (!note) return;

      const bk = document.createElement("div");
      bk.className = "black-key";
      bk.dataset.freq = note.freq;

      const label = document.createElement("div");
      label.className = "note-label";
      label.textContent = note.name;
      bk.appendChild(label);

      bk.style.width = blackW + "%";
      bk.style.left = (i + 1) * whiteW - blackW / 2 + "%";

      container.appendChild(bk);
    }
  });
}

buildPiano(document.getElementById("piano-single"), notes);
buildPiano(document.getElementById("piano-top"), notes.slice(0,12));
buildPiano(document.getElementById("piano-bottom"), notes.slice(12,24));

/* ===== 完全修正版 マルチタッチエンジン ===== */

let activeKeys = new Set();

function clearAllActive() {
  activeKeys.forEach(k => k.classList.remove("active"));
  activeKeys.clear();
}

function updateTouches(touches) {
  const newActive = new Set();

  for (const t of touches) {
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const key = el?.closest(".white-key, .black-key");
    if (!key) continue;

    newActive.add(key);

    if (!activeKeys.has(key)) {
      key.classList.add("active");
      playNote(parseFloat(key.dataset.freq));
    }
  }

  // 解除されたキーを消す
  activeKeys.forEach(k => {
    if (!newActive.has(k)) k.classList.remove("active");
  });

  activeKeys = newActive;
}

document.addEventListener("touchstart", e => {
  updateTouches(e.touches);
});

document.addEventListener("touchmove", e => {
  updateTouches(e.touches);
  e.preventDefault();
}, { passive: false });

document.addEventListener("touchend", e => {
  updateTouches(e.touches);
});

document.addEventListener("touchcancel", e => {
  clearAllActive();
});
</script>

</body>
</html>
